<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landuse Sensitivity Analysis</title>
    <style>
        body {
            background-color: #282a36;
            color: #f8f8f2;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            color: #ff79c6;
        }
        a {
            color: #50fa7b;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .container {
            margin-top: 50px;
        }
        .files-list {
            list-style-type: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .files-list li {
            background-color: #44475a;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #50fa7b;
        }
        .files-list li a {
            font-size: 1.4em;
            display: block;
            text-align: center;
        }
        .files-list li a:hover {
            background-color: #6272a4;
        }
        .back-link {
            margin-top: 40px;
            font-size: 1.2em;
        }
        .back-link a {
            color: #ff79c6;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1 id="pageTitle"></h1>
    <div class="container">
        <p>Selecciona uno de los siguientes archivos para ver más detalles:</p>
        <ul class="files-list" id="filesList">
            <!-- Los archivos se insertarán aquí con JavaScript -->
        </ul>
    </div>
    <div class="back-link">
        <a href="../index.html">Volver al índice principal</a>
    </div>

    <script>
        // Definir la carpeta y los archivos en variables
        var folderName = "LAI"; // Puedes cambiar este valor
        var files = [
            folderName + "_HFX.html",
            folderName + "_LH.html",
            folderName + "_PBLH.html",
            folderName + "_QFX.html",
            folderName + "_T2.html",
            folderName + "_TSK.html",
            folderName + "_U10.html",
            folderName + "_UST.html",
            folderName + "_V10.html"
        ];

        // Cambiar el título de la página
        document.getElementById("pageTitle").innerText = folderName + " - Landuse Sensitivity Analysis";

        // Generar la lista de archivos
        var filesListElement = document.getElementById("filesList");
        files.forEach(function(file) {
            var listItem = document.createElement("li");
            var link = document.createElement("a");
            link.href = file;
            link.innerText = file.replace(".html", ""); // Mostrar sin la extensión .html
            listItem.appendChild(link);
            filesListElement.appendChild(listItem);
        });
    </script>

</body>
</html>
