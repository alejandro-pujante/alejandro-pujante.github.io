<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landuse Sensitivity Analysis</title>
  <style>
    body {
      background-color: #282a36;
      color: #f8f8f2;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      color: #ff79c6;
    }
    a {
      color: #50fa7b;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .container {
      margin-top: 50px;
    }
    .files-list {
      list-style-type: none;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .files-list li {
      background-color: #44475a;
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #50fa7b;
    }
    .thumbnail {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 4px;
    }
    .file-link {
      margin-top: 10px;
      font-size: 1.2em;
      display: block;
    }
    .file-link:hover {
      background-color: #6272a4;
    }
    .back-link {
      margin-top: 40px;
      font-size: 1.2em;
    }
    .back-link a {
      color: #ff79c6;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1 id="pageTitle"></h1>
  <div class="container">
    <p>Selecciona uno de los siguientes archivos para ver más detalles:</p>
    <ul class="files-list" id="filesList">
      <!-- Los archivos se insertarán aquí con JavaScript -->
    </ul>
  </div>
  <div class="back-link">
    <a href="../index.html">Volver al índice principal</a>
  </div>

  <script>
    var folderName = "Z0";
    var files = [
      folderName + "_HFX.html",
      folderName + "_LH.html",
      folderName + "_PBLH.html",
      folderName + "_QFX.html",
      folderName + "_T2.html",
      folderName + "_TSK.html",
      folderName + "_U10.html",
      folderName + "_UST.html",
      folderName + "_V10.html"
    ];

    document.getElementById("pageTitle").innerText = folderName + " - Landuse Sensitivity Analysis";

    var filesListElement = document.getElementById("filesList");
    files.forEach(function(file) {
      var listItem = document.createElement("li");

      // Miniatura como iframe
      var iframe = document.createElement("iframe");
      iframe.src = file;
      iframe.className = "thumbnail";

      // Enlace con el nombre del archivo
      var link = document.createElement("a");
      link.href = file;
      link.className = "file-link";
      link.innerText = file.replace(".html", "");

      listItem.appendChild(iframe);
      listItem.appendChild(link);
      filesListElement.appendChild(listItem);
    });
  </script>

</body>
</html>
